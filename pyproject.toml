# The contents of this file is based on https://github.com/home-assistant/core/blob/dev/pyproject.toml

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "B007",    # Loop control variable {name} not used within loop body
    "B014",    # Exception handler with duplicate exception
    "C",       # complexity
    "D",       # docstrings
    "E",       # pycodestyle
    "F",       # pyflakes/autoflake
    "ICN001",  # import concentions; {name} should be imported as {asname}
    "PGH004",  # Use specific rule codes when using noqa
    "PLC0414", # Useless import alias. Import alias does not rename original package.
    "SIM105",  # Use contextlib.suppress({exception}) instead of try-except-pass
    "SIM117",  # Merge with-statements that use the same scope
    "SIM118",  # Use {key} in {dict} instead of {key} in {dict}.keys()
    "SIM201",  # Use {left} != {right} instead of not {left} == {right}
    "SIM212",  # Use {a} if {a} else {b} instead of {b} if not {a} else {a}
    "SIM300",  # Yoda conditions. Use 'age == 42' instead of '42 == age'.
    "SIM401",  # Use get from dict with default instead of an if block
    "T20",     # flake8-print
    "TRY004",  # Prefer TypeError exception for invalid type
    "RUF006",  # Store a reference to the return value of asyncio.create_task
    "UP",      # pyupgrade
    "W",       # pycodestyle
]

ignore = [
    "D202",  # No blank lines allowed after function docstring
    "D203",  # 1 blank line required before class docstring
    "D213",  # Multi-line docstring summary should start at the second line
    "D404",  # First word of the docstring should not be This
    "D406",  # Section name should end with a newline
    "D407",  # Section name underlining
    "D411",  # Missing blank line before section
    "E501",  # line too long
    "E731",  # do not assign a lambda expression, use a def
    "UP006", # replaces keep-runtime-typing = true
    "UP007", # replaces keep-runtime-typing = true
]

[tool.ruff.lint.per-file-ignores]
# wattwise.py uses `dt` as a local variable name in several functions, so the
# `import datetime as dt` convention (ICN001) would shadow it.
"wattwise.py" = ["ICN001"]
# Tests: the test names say what they check, and the fake AppDaemon API mirrors
# AppDaemon's methods; they need no docstrings. `datetime` as in wattwise.py.
"tests/*" = ["D1", "ICN001"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.mccabe]
max-complexity = 25
[tool.mypy]
# Type check of wattwise.py (repo-kit CI standard, category 3). Strict, with two relaxations:
files = ["wattwise.py"]
python_version = "3.11"
warn_unused_configs = true
strict = true
# 1. The app's methods are not annotated yet (about 30 functions); annotate a method when
#    you change it. Until all are annotated, untyped definitions and calls are allowed.
disallow_untyped_defs = false
disallow_untyped_calls = false
# 2. AppDaemon is not installed for the checks (it only runs inside the add-on), so
#    hass.Hass is Any and WattWise subclasses Any.
disallow_subclassing_any = false

# appdaemon: see 2. above; pulp ships no type information.
[[tool.mypy.overrides]]
module = ["appdaemon", "appdaemon.*", "pulp"]
ignore_missing_imports = true

[tool.mutmut]
# Mutation testing (scripts/mutate.sh, weekly workflow): wattwise.py against tests/.
source_paths = ["wattwise.py"]
pytest_add_cli_args_test_selection = ["tests/"]
