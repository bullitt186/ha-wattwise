name: Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Ruff, Black and yamllint in the versions of requirements-dev.txt.
      - name: Install the linters
        run: python -m pip install -r requirements-dev.txt

      # Settings: [tool.ruff] in pyproject.toml.
      - name: Ruff
        run: ruff check .

      - name: Black (check)
        run: black --check .

      - name: yamllint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 180}}}" .
