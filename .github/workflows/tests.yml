name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The AppDaemon add-on's Python and the newest one.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the test dependencies
        run: python -m pip install -r requirements-dev.txt

      # Offline: AppDaemon is replaced by a stub (tests/conftest.py); the optimisation
      # uses the CBC solver bundled with pulp.
      - name: pytest
        run: python -m pytest -v tests

  mypy:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install mypy and the app's libraries
        run: python -m pip install -r requirements-dev.txt

      # Settings: [tool.mypy] in pyproject.toml.
      - name: mypy
        run: mypy
